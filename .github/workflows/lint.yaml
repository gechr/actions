name: lint

on:
  # Reusable entry point for other repos:
  #   uses: gechr/actions/.github/workflows/lint.yaml@<ref>
  workflow_call:
    inputs:
      language:
        description: "Project language: 'go' or 'rust'."
        type: string
        required: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # clover: provider=auto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go projects lint against the toolchain pinned in go.mod. Rust projects
      # rely on the toolchain preinstalled on the runner, so no setup is needed.
      - name: Set up Go
        if: inputs.language == 'go'
        # clover: provider=auto
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Lint
        run: make lint
