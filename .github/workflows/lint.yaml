name: lint

on:
  # Reusable entry point for other repos:
  #   uses: gechr/actions/.github/workflows/lint.yaml@<ref>
  workflow_call:
    inputs:
      language:
        description: "Project language: 'go', 'rust' or 'swift'."
        type: string
        required: true
      runs-on:
        description: "Runner label to lint on."
        type: string
        required: false
        default: ubuntu-latest

permissions: {}

jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # @clover
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go projects lint against the toolchain pinned in go.mod. Rust projects
      # rely on the toolchain preinstalled on the runner, so no setup is needed.
      - name: Set up Go
        if: inputs.language == 'go'
        # @clover
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Swift projects lint with SwiftLint and SwiftFormat from Homebrew.
      - name: Install Swift linters
        if: inputs.language == 'swift'
        run: |
          brew update
          brew install swiftlint swiftformat

      - name: Lint
        run: make lint
