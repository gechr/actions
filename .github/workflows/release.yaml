name: release

on:
  # Reusable entry point for other repos. Callers trigger on tag push and
  # forward only the secret this workflow needs:
  #   uses: gechr/actions/.github/workflows/release.yaml@<ref>
  #   secrets:
  #     RELEASER_APP_PRIVATE_KEY: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
  workflow_call:
    inputs:
      language:
        description: "Project language: 'go' or 'rust'."
        type: string
        required: true
      name:
        description: "Binary / Homebrew formula name."
        type: string
        required: true
      desc:
        description: "One-line description for the Homebrew formula."
        type: string
        required: true
    secrets:
      RELEASER_APP_PRIVATE_KEY:
        description: "Private key for the releaser GitHub App."
        required: true

permissions: {}

jobs:
  verify-tag:
    permissions:
      contents: read
    # @clover
    uses: gechr/actions/.github/workflows/verify-tag.yaml@f86637c131004611b2346f2f3102ed291b13a412 # v0.2.9

  publish:
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout repository
        # @clover
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint homebrew-tap token
        id: app-token
        # @clover
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Mint scoop-bucket token
        id: scoop-token
        # @clover
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          repositories: scoop-bucket
          permission-contents: write

      - name: Set up Go
        if: inputs.language == 'go'
        # @clover
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install cargo-zigbuild
        if: inputs.language == 'rust'
        # @clover
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-zigbuild

      - name: Set up Zig
        if: inputs.language == 'rust'
        # @clover
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
          use-cache: false

      - name: Run GoReleaser
        # @clover
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOOP_GITHUB_TOKEN: ${{ steps.scoop-token.outputs.token }}

      - name: Publish Homebrew formula (Go)
        if: inputs.language == 'go'
        # @clover
        uses: gechr/homebrew-publish-formula@04c96853dce59cfbfca97503d2cc625cb3321cee # v1.0.5
        with:
          name: ${{ inputs.name }}
          desc: ${{ inputs.desc }}
          token: ${{ steps.app-token.outputs.token }}
          version: ${{ github.ref_name }}
          homepage: https://github.com/${{ github.repository }}

      - name: Publish Homebrew formula (Rust)
        if: inputs.language == 'rust'
        # @clover
        uses: gechr/homebrew-publish-formula@04c96853dce59cfbfca97503d2cc625cb3321cee # v1.0.5
        with:
          name: ${{ inputs.name }}
          desc: ${{ inputs.desc }}
          token: ${{ steps.app-token.outputs.token }}
          version: ${{ github.ref_name }}
          homepage: https://github.com/${{ github.repository }}
          head-depends-on: rust
          head-build-binary: target/release/${{ inputs.name }}
          completion-args: "--completions"
          shell-parameter-format: ""
