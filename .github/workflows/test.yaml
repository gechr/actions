name: test

on:
  # Reusable entry point for other repos:
  #   uses: gechr/actions/.github/workflows/test.yaml@<ref>
  workflow_call:
    inputs:
      language:
        description: "Project language: 'go', 'rust' or 'swift'."
        type: string
        required: true
      apt-packages:
        description: "Space-separated apt packages to install before testing (Linux runners only)."
        type: string
        required: false
        default: ""
      setup-nu:
        description: "Install Nushell before testing (for shell-completion tests that exec nu)."
        type: boolean
        required: false
        default: false
      runs-on:
        description: "JSON array of runner labels to matrix the test job over."
        type: string
        required: false
        default: '["ubuntu-latest"]'

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runs-on) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # @clover
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go projects test against the toolchain pinned in go.mod. Rust projects
      # rely on the toolchain preinstalled on the runner, so no setup is needed.
      - name: Set up Go
        if: inputs.language == 'go'
        # @clover
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Swift projects test against the latest stable Xcode on GitHub-hosted
      # macOS runners. Custom runners (e.g. xcode-27) ship their own Xcode.
      - name: Set up Xcode
        if: inputs.language == 'swift' && startsWith(matrix.os, 'macos-')
        # @clover
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # Opt-in extra system dependencies (e.g. shells for completion tests).
      # Guarded to Linux so a Windows leg in the matrix stays unaffected.
      - name: Install apt packages
        if: inputs.apt-packages != '' && runner.os == 'Linux'
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        # APT_PACKAGES is intentionally unquoted so a space-separated list
        # word-splits into multiple package arguments.
        run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES

      # Nushell isn't an apt package, so it gets its own opt-in setup step.
      - name: Set up Nushell
        if: inputs.setup-nu
        # @clover
        uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: "*"

      - name: Test
        run: make test
